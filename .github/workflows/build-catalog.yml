name: Build Project Catalog

on:
  push:
    paths:
      - repos.txt

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requests
        run: pip install requests

      - name: Build Catalog
        run: python scripts/build_catalog.py

      - name: Commit Changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add projects.json creators.json

          git diff --staged --quiet || git commit -m "Update catalog"

          git push
